name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.1.0)"
        required: true

permissions:
  contents: write
  id-token: write   # for PyPI trusted publishing
  packages: write   # for GHCR

jobs:
  # -----------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spraymaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Validate distribution
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No api-token needed: this requires the project to be configured for
        # PyPI Trusted Publishing — set up at https://pypi.org/manage/account/publishing/

  # -----------------------------------------------------------------------------
  publish-npm:
    name: Publish npm wrapper
    runs-on: ubuntu-latest
    needs: publish-pypi   # publish to PyPI first so postinstall can find the package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sanity-check version match
        working-directory: npm
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::npm package.json version ($PKG_VER) does not match git tag ($TAG_VER)"
            exit 1
          fi
      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # -----------------------------------------------------------------------------
  publish-docker:
    name: Publish Docker image (GHCR + Docker Hub)
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/spraymaster
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/spraymaster', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------------
  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64,  ext: ""    }
          - { os: macos-latest,   target: macos-arm64, ext: ""    }
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + PyInstaller
        # Skip optional native protocols (impacket / pymssql / psycopg2) for the
        # static-binary build — they need compilers and don't bundle cleanly. Users
        # who need those should grab the Docker image or pip install.
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build binary
        run: pyinstaller packaging/spraymaster.spec --clean --noconfirm
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/spraymaster${{ matrix.ext }}" "out/spraymaster-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-npm, publish-docker, build-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SprayMaster ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            ### Install

            ```bash
            pipx install spraymaster         # Python (recommended)
            pip  install spraymaster         # Python
            npm  install -g spraymaster      # Node wrapper
            docker pull ghcr.io/${{ github.repository_owner }}/spraymaster
            ```

            Or download a standalone binary below (no Python required).
          files: artifacts/spraymaster-*
          generate_release_notes: true
