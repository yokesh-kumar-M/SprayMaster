<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SprayMaster — Login</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>SprayMaster</h1>
    <p class="muted">Enter the auth token to continue.</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label>
        Auth token
        <input type="password" name="token_value" autofocus required>
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="muted small">
      Set <code>SPRAYMASTER_AUTH_TOKEN</code> in your environment before starting
      the server. If unset, a random token was printed to stderr on boot.
    </p>
  </main>
</body>
</html>
